apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  labels:
    app: billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: billing-service
          image: 469511944493.dkr.ecr.us-east-1.amazonaws.com/billing-service:0d7e816
          ports:
            - containerPort: 6200
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
spec:
  type: LoadBalancer
  selector:
    app: billing-service
  ports:
    - port: 6200
      targetPort: 6200

